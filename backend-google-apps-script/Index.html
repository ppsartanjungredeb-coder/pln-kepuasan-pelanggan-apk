const fs=document.getElementById('fs');async function toggleFS(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(e){console.warn(e)}}if(fs){fs.onclick=toggleFS;document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'×':'⛶';fs.title=document.fullscreenElement?'Keluar fullscreen':'Fullscreen'})};
const buttons=[...document.querySelectorAll('.rate')],ov=document.getElementById('ov'),status=document.getElementById('status'),st=document.getElementById('st');let locked=false,publicCfg={device:'TABLET-01',location:'Kantor PLN ULP Tanjung Redeb',counter:'Ruang Pelayanan'};const Q='pln_gas_queue_v1';
function id(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2))}function q(){try{return JSON.parse(localStorage.getItem(Q)||'[]')}catch{return[]}}function sq(v){localStorage.setItem(Q,JSON.stringify(v))}function net(){status.classList.toggle('offline',!navigator.onLine);st.textContent=navigator.onLine?'Online':'Offline • akan disinkronkan otomatis'}
function send(p){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveSurvey(p))}
async function flush(){if(!navigator.onLine)return;const a=q();if(!a.length)return;const left=[];for(const p of a){try{await send(p)}catch(e){left.push(p)}}sq(left)}
