<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0072BC" />
  <title>Kepuasan Pelanggan - PLN ULP Tanjung Redeb</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="top-accent"></div>
    <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Tampilan layar penuh" title="Fullscreen">⛶</button>
    <main class="main">
      <section class="panel" aria-labelledby="survey-title">
        <img class="logo" src="assets/logo-pln.jpg" alt="PLN ULP Tanjung Redeb" />
        <div class="eyebrow">Survei Kepuasan Pelanggan</div>
        <h1 id="survey-title">Bagaimana Pelayanan Kami Hari Ini?</h1>
        <p class="subtitle">PLN ULP Tanjung Redeb</p>
        <p class="hint">Silakan sentuh satu emoticon sesuai pengalaman pelayanan Anda.</p>

        <div class="rating-grid" id="ratingGrid">
          <button class="rating-btn excellent" data-category="SANGAT BAIK" data-score="4" data-rating="😄" aria-label="Sangat Baik">
            <span class="emoji">😄</span><span class="rating-label">SANGAT BAIK</span>
          </button>
          <button class="rating-btn good" data-category="BAIK" data-score="3" data-rating="🙂" aria-label="Baik">
            <span class="emoji">🙂</span><span class="rating-label">BAIK</span>
          </button>
          <button class="rating-btn bad" data-category="BURUK" data-score="2" data-rating="☹️" aria-label="Buruk">
            <span class="emoji">☹️</span><span class="rating-label">BURUK</span>
          </button>
          <button class="rating-btn very-bad" data-category="SANGAT BURUK" data-score="1" data-rating="😡" aria-label="Sangat Buruk">
            <span class="emoji">😡</span><span class="rating-label">SANGAT BURUK</span>
          </button>
        </div>
      </section>
    </main>

    <div class="status demo" id="status"><span class="dot"></span><span id="statusText">Demo • data tersimpan lokal</span></div>
    <div class="footer-mark">Melayani Sepenuh Hati</div>
  </div>

  <div class="overlay" id="thanksOverlay" aria-hidden="true">
    <div class="thanks-card">
      <div class="check">✓</div>
      <h2>Terima Kasih</h2>
      <p>Penilaian Anda sangat berarti bagi peningkatan pelayanan PLN ULP Tanjung Redeb.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
