plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pln.ulptanjungredeb.kepuasan'
    compileSdk 35

    defaultConfig {
        applicationId "com.pln.ulptanjungredeb.kepuasan"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "4.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
